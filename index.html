<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - Juego Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🚀 SPACE INVADERS 🚀</h1>
        
        <div class="game-info">
            <div class="score">
                <span>Puntuación:</span>
                <span id="score">0</span>
            </div>
            <div class="lives">
                <span>Vidas:</span>
                <span id="lives">3</span>
            </div>
            <div class="level">
                <span>Nivel:</span>
                <span id="level">1</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="controls">
            <p>⬅️ ➡️ Mover | ESPACIO Disparar</p>
            <button id="startBtn" class="btn">Iniciar Juego</button>
            <button id="pauseBtn" class="btn">Pausar</button>
        </div>

        <div id="gameOverScreen" class="game-over-screen hidden">
            <div class="game-over-content">
                <h2 id="gameOverTitle">GAME OVER</h2>
                <p id="gameOverMessage"></p>
                <button id="restartBtn" class="btn">Jugar de Nuevo</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
