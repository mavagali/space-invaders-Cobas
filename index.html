<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - Juego Arcade</title>
    <!-- Google Fonts for Retro Arcade Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.5">
</head>
<body>
    <div class="crt-overlay"></div>
    <div class="container">
        <h1>🚀 SPACE INVADERS 🚀</h1>
        
        <div class="game-info">
            <div class="score">
                <span>Puntuación:</span>
                <span id="score">0</span>
            </div>
            <div class="lives">
                <span>Vidas:</span>
                <span id="lives">3</span>
            </div>
            <div class="level">
                <span>Nivel:</span>
                <span id="level">1</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- Controles Táctiles para Móviles -->
        <div id="mobileControls" class="mobile-controls">
            <div class="movement-keys">
                <button id="touchLeft" class="touch-btn">⬅️</button>
                <button id="touchRight" class="touch-btn">➡️</button>
            </div>
            <button id="touchFire" class="touch-btn fire-btn">🔥</button>
        </div>

        <div class="controls">
            <div class="difficulty-select">
                <span class="diff-label">DIFICULTAD:</span>
                <div class="diff-options">
                    <button class="diff-opt" data-diff="easy">FÁCIL</button>
                    <button class="diff-opt active" data-diff="normal">NORMAL</button>
                    <button class="diff-opt" data-diff="hard">DIFÍCIL</button>
                    <button class="diff-opt" data-diff="nightmare">PESADILLA</button>
                </div>
            </div>
            <p>⬅️ ➡️ Mover | ESPACIO Disparar</p>
            <button id="startBtn" class="btn">Iniciar Juego</button>
            <button id="pauseBtn" class="btn">Pausar</button>
        </div>

        <div id="gameOverScreen" class="game-over-screen hidden">
            <div class="game-over-content">
                <h2 id="gameOverTitle">GAME OVER</h2>
                <p id="gameOverMessage"></p>
                <button id="restartBtn" class="btn">Jugar de Nuevo</button>
            </div>
        </div>
    </div>

    <script src="game.js?v=1.5"></script>
</body>
</html>
